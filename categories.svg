<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346" role="img" aria-label="Four things I test for">
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.k{animation:i .6s ease-out both}@keyframes i{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
<rect width="1000" height="346" rx="14" fill="#0b1b33"/>
<text x="25" y="40" font-size="19" font-weight="700" fill="#fff">Four things I test for</text>
<text x="25" y="62" font-size="13" fill="#8fb3dd">Each test has one goal and one result you can observe. No judgement calls.</text>
<g class="k" style="animation-delay:0.00s"><rect x="25.0" y="84" width="221.0" height="236" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="25.0" y="84" width="221.0" height="4" rx="2" fill="#d95926"/>
<text x="45.0" y="125" font-size="15.5" font-weight="700" fill="#fff">Prompt injection</text>
<text x="45.0" y="158" font-size="12" fill="#8fb3dd">Does it follow instructions</text>
<text x="45.0" y="175" font-size="12" fill="#8fb3dd">that aren't its owner's?</text>
<text x="45.0" y="198" font-size="12.5" fill="#cfe3ff">Typed by the user, or</text>
<text x="45.0" y="217" font-size="12.5" fill="#cfe3ff">hidden in a document, email</text>
<text x="45.0" y="236" font-size="12.5" fill="#cfe3ff">or page the agent reads</text>
<rect x="45.0" y="284" width="169" height="24" rx="12" fill="#d95926" fill-opacity=".22"/><text x="57.0" y="300.5" font-size="11.5" font-weight="600" fill="#fff">7 tests · OWASP LLM01</text>
</g>
<g class="k" style="animation-delay:0.08s"><rect x="268.0" y="84" width="221.0" height="236" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="268.0" y="84" width="221.0" height="4" rx="2" fill="#e66767"/>
<text x="288.0" y="125" font-size="15.5" font-weight="700" fill="#fff">Data leakage</text>
<text x="288.0" y="158" font-size="12" fill="#8fb3dd">Does it reveal what the asker</text>
<text x="288.0" y="175" font-size="12" fill="#8fb3dd">shouldn't see?</text>
<text x="288.0" y="198" font-size="12.5" fill="#cfe3ff">Its instructions, planted</text>
<text x="288.0" y="217" font-size="12.5" fill="#cfe3ff">secrets, another user's</text>
<text x="288.0" y="236" font-size="12.5" fill="#cfe3ff">records, restricted</text>
<text x="288.0" y="255" font-size="12.5" fill="#cfe3ff">documents</text>
<rect x="288.0" y="284" width="176" height="24" rx="12" fill="#e66767" fill-opacity=".22"/><text x="300.0" y="300.5" font-size="11.5" font-weight="600" fill="#fff">6 tests · LLM02, LLM07</text>
</g>
<g class="k" style="animation-delay:0.16s"><rect x="511.0" y="84" width="221.0" height="236" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="511.0" y="84" width="221.0" height="4" rx="2" fill="#9085e9"/>
<text x="531.0" y="125" font-size="15.5" font-weight="700" fill="#fff">Excessive permissions</text>
<text x="531.0" y="158" font-size="12" fill="#8fb3dd">Can it do more than its</text>
<text x="531.0" y="175" font-size="12" fill="#8fb3dd">purpose needs?</text>
<text x="531.0" y="198" font-size="12.5" fill="#cfe3ff">Actions on other people's</text>
<text x="531.0" y="217" font-size="12.5" fill="#cfe3ff">resources, no approval</text>
<text x="531.0" y="236" font-size="12.5" fill="#cfe3ff">step, tools it shouldn't</text>
<text x="531.0" y="255" font-size="12.5" fill="#cfe3ff">hold</text>
<rect x="531.0" y="284" width="128" height="24" rx="12" fill="#9085e9" fill-opacity=".22"/><text x="543.0" y="300.5" font-size="11.5" font-weight="600" fill="#fff">6 tests · LLM06</text>
</g>
<g class="k" style="animation-delay:0.24s"><rect x="754.0" y="84" width="221.0" height="236" rx="10" fill="#10233f" stroke="#2a4f80"/><rect x="754.0" y="84" width="221.0" height="4" rx="2" fill="#3987e5"/>
<text x="774.0" y="125" font-size="15.5" font-weight="700" fill="#fff">Unsafe content</text>
<text x="774.0" y="158" font-size="12" fill="#8fb3dd">Does it stay in its role?</text>
<text x="774.0" y="181" font-size="12.5" fill="#cfe3ff">Persona overrides,</text>
<text x="774.0" y="200" font-size="12.5" fill="#cfe3ff">role-play framing, advice</text>
<text x="774.0" y="219" font-size="12.5" fill="#cfe3ff">outside its purpose,</text>
<text x="774.0" y="238" font-size="12.5" fill="#cfe3ff">invented answers</text>
<rect x="774.0" y="284" width="176" height="24" rx="12" fill="#3987e5" fill-opacity=".22"/><text x="786.0" y="300.5" font-size="11.5" font-weight="600" fill="#fff">5 tests · LLM01, LLM09</text>
</g>
</svg>