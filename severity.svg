<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="436" viewBox="0 0 1000 436" role="img" aria-label="Severity matrix">
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.k{animation:i .6s ease-out both}@keyframes i{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
<rect width="1000" height="436" rx="14" fill="#0b1b33"/>
<text x="25" y="40" font-size="19" font-weight="700" fill="#fff">Severity = impact × ease</text>
<text x="25" y="62" font-size="13" fill="#8fb3dd">What the attacker gets, against what they need to get it. Agreed with the owner before testing starts.</text>
<text x="408.0" y="98" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Easy</text><text x="408.0" y="116" font-size="11.5" fill="#8fb3dd" text-anchor="middle">One message, or planted content</text>
<text x="634.0" y="98" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Moderate</text><text x="634.0" y="116" font-size="11.5" fill="#8fb3dd" text-anchor="middle">Several turns or an encoding</text>
<text x="860.0" y="98" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Hard</text><text x="860.0" y="116" font-size="11.5" fill="#8fb3dd" text-anchor="middle">Insider access, rare condition</text>
<text x="25" y="166" font-size="14.5" font-weight="700" fill="#fff">High impact</text><text x="25" y="185" font-size="12" fill="#8fb3dd">Other people's data, secrets, real actions</text>
<g class="k" style="animation-delay:0.00s"><rect x="300" y="132" width="216" height="76" rx="10" fill="#e66767" fill-opacity=".9"/><text x="408.0" y="176.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Critical</text></g>
<g class="k" style="animation-delay:0.05s"><rect x="526" y="132" width="216" height="76" rx="10" fill="#d95926" fill-opacity=".9"/><text x="634.0" y="176.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">High</text></g>
<g class="k" style="animation-delay:0.10s"><rect x="752" y="132" width="216" height="76" rx="10" fill="#c98500" fill-opacity=".9"/><text x="860.0" y="176.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Medium</text></g>
<text x="25" y="252" font-size="14.5" font-weight="700" fill="#fff">Medium impact</text><text x="25" y="271" font-size="12" fill="#8fb3dd">Internal information, rules removed</text>
<g class="k" style="animation-delay:0.15s"><rect x="300" y="218" width="216" height="76" rx="10" fill="#d95926" fill-opacity=".9"/><text x="408.0" y="262.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">High</text></g>
<g class="k" style="animation-delay:0.20s"><rect x="526" y="218" width="216" height="76" rx="10" fill="#c98500" fill-opacity=".9"/><text x="634.0" y="262.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Medium</text></g>
<g class="k" style="animation-delay:0.25s"><rect x="752" y="218" width="216" height="76" rx="10" fill="#199e70" fill-opacity=".9"/><text x="860.0" y="262.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Low</text></g>
<text x="25" y="338" font-size="14.5" font-weight="700" fill="#fff">Low impact</text><text x="25" y="357" font-size="12" fill="#8fb3dd">Missing safeguard, poor content</text>
<g class="k" style="animation-delay:0.30s"><rect x="300" y="304" width="216" height="76" rx="10" fill="#c98500" fill-opacity=".9"/><text x="408.0" y="348.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Medium</text></g>
<g class="k" style="animation-delay:0.35s"><rect x="526" y="304" width="216" height="76" rx="10" fill="#199e70" fill-opacity=".9"/><text x="634.0" y="348.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Low</text></g>
<g class="k" style="animation-delay:0.40s"><rect x="752" y="304" width="216" height="76" rx="10" fill="#199e70" fill-opacity=".9"/><text x="860.0" y="348.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Low</text></g>
<text x="25" y="416" font-size="12" fill="#8fb3dd">Raise one level if the victim does nothing (indirect injection) or the effect cannot be undone. Lower one level if a tested outside control limits the impact.</text></svg>