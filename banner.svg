<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="AI agent red team playbook">
<style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.k{animation:i .6s ease-out both}@keyframes i{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#0b1b33'/><stop offset='1' stop-color='#1b2a4a'/></linearGradient><linearGradient id='ln' x1='0' x2='1'><stop offset='0' stop-color='#e66767'/><stop offset='1' stop-color='#d95926'/></linearGradient></defs>
<rect width="1000" height="220" rx="14" fill="url(#bg)"/>
<text class="k" x="44" y="80" font-size="34" font-weight="700" fill="#fff">AI agent red team playbook</text>
<rect class="k" x="44" y="96" width="130" height="4" rx="2" fill="url(#ln)"/>
<text class="k" style="animation-delay:.2s" x="44" y="134" font-size="17" fill="#cfe3ff">How I test AI agents: map what the agent can reach, probe it, rate what breaks, get it fixed</text>
<g class="k" style="animation-delay:.4s"><rect x="44" y="160" width="105" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="60" y="184" font-size="16" font-weight="700" fill="#e66767">24</text><text x="89" y="184" font-size="13.5" fill="#cfe3ff">tests</text></g>
<g class="k" style="animation-delay:.4s"><rect x="161" y="160" width="130" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="177" y="184" font-size="16" font-weight="700" fill="#e66767">4</text><text x="196" y="184" font-size="13.5" fill="#cfe3ff">categories</text></g>
<g class="k" style="animation-delay:.4s"><rect x="303" y="160" width="100" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="319" y="184" font-size="16" font-weight="700" fill="#e66767">5</text><text x="338" y="184" font-size="13.5" fill="#cfe3ff">phases</text></g>
<g class="k" style="animation-delay:.4s"><rect x="415" y="160" width="174" height="36" rx="18" fill="#10233f" stroke="#2a4f80"/><text x="431" y="184" font-size="16" font-weight="700" fill="#e66767">3</text><text x="450" y="184" font-size="13.5" fill="#cfe3ff">report templates</text></g>
</svg>